version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: 1.2.x
    schedule: {interval: weekly, day: friday}
    open-pull-requests-limit: 5
    cooldown: {default-days: 7}
    groups:
      github-actions-1-2-x: {patterns: ["*"]}
    labels: [dependencies, github_actions, 1.2.x]
    commit-message: {prefix: ci, include: scope}
  - package-ecosystem: composer
    directory: /
    target-branch: 1.2.x
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    cooldown: {default-days: 7}
    groups:
      composer-1-2-x: {patterns: ["*"]}
    labels: [dependencies, composer, 1.2.x]
    commit-message: {prefix: deps, include: scope}
