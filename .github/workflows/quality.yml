name: Quality

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, mbstring
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate the Composer developer platform
        run: |
          composer composer:validate
          composer security:audit
          composer platform:check
      - name: Lint tracked PHP files
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            php -l "$file" || failed=1
          done < <(git ls-files -z -- '*.php' ':(exclude)include/vendor/**')
          exit "$failed"
      - name: Run project lint and static analysis
        run: |
          composer lint
          composer phpstan
      - name: Lint GitHub Actions
        uses: raven-actions/actionlint@v2
