name: htmx filters

on:
  push:
    branches: [develop]
    paths:
      - 'lib/htmx.php'
      - 'include/global.php'
      - 'include/js/htmx.js'
      - 'include/js/htmx.js.version'
      - 'lib/html.php'
      - 'include/global_settings.php'
      - 'tests/Unit/HtmxTest.php'
      - 'tests/integration/HtmxLoaderTest.php'
      - 'tests/integration/fixtures/htmx_fixture.php'
      - 'tests/e2e/tests/htmx-loader.spec.ts'
      - 'tests/e2e/tests/login-smoke.spec.ts'
      - 'tests/e2e/Dockerfile'
      - 'tests/e2e/docker-compose.yml'
      - 'tests/e2e/entrypoint.sh'
      - 'tests/e2e/playwright.config.ts'
      - 'tests/e2e/package.json'
      - 'tests/e2e/package-lock.json'
      - '.github/workflows/htmx-filters.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'lib/htmx.php'
      - 'include/global.php'
      - 'include/js/htmx.js'
      - 'include/js/htmx.js.version'
      - 'lib/html.php'
      - 'include/global_settings.php'
      - 'tests/Unit/HtmxTest.php'
      - 'tests/integration/HtmxLoaderTest.php'
      - 'tests/integration/fixtures/htmx_fixture.php'
      - 'tests/e2e/tests/htmx-loader.spec.ts'
      - 'tests/e2e/tests/login-smoke.spec.ts'
      - 'tests/e2e/Dockerfile'
      - 'tests/e2e/docker-compose.yml'
      - 'tests/e2e/entrypoint.sh'
      - 'tests/e2e/playwright.config.ts'
      - 'tests/e2e/package.json'
      - 'tests/e2e/package-lock.json'
      - '.github/workflows/htmx-filters.yml'

permissions:
  contents: read

concurrency:
  group: htmx-filters-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Pest unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, gd, ldap, gmp, xml, mbstring, pdo_mysql, curl, json
          tools: composer:v2
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ runner.os }}-composer-locked-htmx-unit-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-locked-htmx-unit-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pest unit suite
        run: include/vendor/bin/pest --testsuite=Unit --filter=HtmxTest

  integration:
    name: Pest integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, gd, ldap, gmp, xml, mbstring, pdo_mysql, curl, json
          tools: composer:v2
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ runner.os }}-composer-locked-htmx-integration-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-locked-htmx-integration-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Named file rather than --testsuite=Integration --filter: PHPUnit loads
      # every file in a testsuite before --filter applies, and
      # AuthSystemRegressionIntegrationTest.php declares db_* stubs that fatal
      # against the real lib/database.php the sibling DB tests require.
      - name: Run Pest integration suite
        run: include/vendor/bin/pest tests/integration/HtmxLoaderTest.php

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'

      - name: Build and start the Cacti stack
        working-directory: tests/e2e
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "cacti is reachable"
              exit 0
            fi
            sleep 3
          done
          echo "cacti never became reachable; dumping compose logs"
          docker compose logs --no-color
          exit 1

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright specs
        working-directory: tests/e2e
        env:
          CACTI_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/htmx-loader.spec.ts tests/login-smoke.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Dump compose logs on failure
        if: failure()
        working-directory: tests/e2e
        run: docker compose logs --no-color

      - name: Tear down compose stack
        if: always()
        working-directory: tests/e2e
        run: docker compose down -v
