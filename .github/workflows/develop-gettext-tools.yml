name: Develop gettext tooling
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install gettext
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gettext
      - name: Verify disposable translation builds
        run: |
          set -euo pipefail
          sh -n locales/update-pot.sh locales/build_gettext.sh locales/build_mo.sh
          python3 tests/tools/test_gettext_scripts.py
