name: cacti_exec Coverage

on:
  push:
    branches: [1.2.x]
    paths:
      - '.github/workflows/cacti-exec-coverage.yml'
      - 'lib/functions.php'
      - 'tests/Unit/CactiExecContractTest.php'
      - 'tests/integration/CactiExecExitCodeTest.php'
      - 'tests/phpunit-cacti-exec.xml'
  pull_request:
    branches: [1.2.x]
    paths:
      - '.github/workflows/cacti-exec-coverage.yml'
      - 'lib/functions.php'
      - 'tests/Unit/CactiExecContractTest.php'
      - 'tests/integration/CactiExecExitCodeTest.php'
      - 'tests/phpunit-cacti-exec.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exit-status:
    name: PHP ${{ matrix.php }} exit status
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pcntl, posix

      - name: Install test dependencies
        run: composer install --working-dir=tests --prefer-dist --no-progress --no-interaction

      - name: Run exit-status regression suite
        working-directory: tests
        run: vendor/bin/pest --configuration=phpunit-cacti-exec.xml
