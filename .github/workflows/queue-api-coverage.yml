name: Queue API Coverage

on:
  push:
    branches: [develop]
    paths: &queue-paths
      - '.github/workflows/queue-api-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'cacti.sql'
      - 'cli/queue_admin.php'
      - 'cli/queue_worker.php'
      - 'install/upgrades/1_3_0.php'
      - 'lib/api_queue.php'
      - 'phpunit.queue.xml'
      - 'tests/Unit/QueueApiTest.php'
      - 'tests/integration/QueueDatabaseTransportIntegrationTest.php'
      - 'tests/e2e/queue/**'
  pull_request:
    branches: [develop]
    paths: *queue-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queue-api-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ALLOW_SUPERUSER: 1

jobs:
  coverage:
    name: Queue API 100% coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: cacti_queue_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.1'
          coverage: xdebug
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Enforce line coverage
        env:
          CACTI_QUEUE_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=cacti_queue_test
          XDEBUG_MODE: coverage
        run: |
          set -euo pipefail
          include/vendor/bin/pest \
            --configuration=phpunit.queue.xml \
            --coverage \
            --coverage-text \
            --min=100
