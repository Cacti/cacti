name: RRDtool capability coverage

on:
  pull_request:
    paths:
      - 'aggregate_graphs.php'
      - 'aggregate_templates.php'
      - 'graphs.php'
      - 'lib/aggregate.php'
      - 'lib/api_aggregate.php'
      - 'lib/cdef.php'
      - 'lib/api_data_source.php'
      - 'lib/boost.php'
      - 'lib/data_query.php'
      - 'lib/rrd.php'
      - 'poller_boost.php'
      - 'tests/Unit/Core/Boost/**'
      - 'tests/Unit/Security/Session/SessionHandlerGcTest.php'
      - 'tests/Unit/Core/Rrd/RrdNativeUpdateCapabilitiesTest.php'
      - 'tests/Unit/Core/Rrd/RrdVersionCheckReuseTest.php'
      - 'tests/e2e/boost/**'
      - 'tests/fixtures/Core/Boost*'
      - 'tests/fixtures/Core/Rrd/**'
      - 'tests/fixtures/Core/ScriptQueryPath.php'
      - 'tests/Unit/Core/ScriptQueryPathTest.php'
      - 'tests/Helpers/RequestCoverage.php'
      - 'tests/integration/BoostProcessTableMariaDbTest.php'
      - 'tests/integration/AggregateCreationIntegrationTest.php'
      - 'tests/fixtures/aggregate_creation_*.php'
      - 'tests/Unit/Ui/Aggregate/**'
      - 'tests/tools/check_changed_php_coverage.py'
      - 'tests/tools/test_check_changed_php_coverage.py'
      - 'tests/phpunit-rrd-capabilities.xml'
      - '.github/workflows/rrd-capability-coverage.yml'

permissions:
  contents: read

jobs:
  coverage:
    name: Changed PHP lines >= 80%
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_DATABASE: cacti
          MARIADB_USER: cactiuser
          MARIADB_PASSWORD: cactiuser
          MARIADB_ROOT_PASSWORD: cactiroot
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.3'
          coverage: xdebug
          extensions: curl, dom, gd, mbstring, pdo_mysql, pcntl, xml
          ini-values: memory_limit=2G
          dependency-mode: locked-maintenance-pr-coverage
          cache-dependency-path: tests/composer.lock
      - name: Install locked test dependencies
        run: composer install --working-dir=tests --prefer-dist --no-progress --no-interaction
      - name: Install RRDtool and database client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mariadb-client rrdtool
      - name: Prepare disposable test databases
        env:
          MYSQL_PWD: cactiroot
        run: |
          set -euo pipefail
          mariadb --host=127.0.0.1 --user=root cacti < cacti.sql
          mariadb --host=127.0.0.1 --user=root -e 'CREATE DATABASE cacti_boost_contract'
          mariadb --host=127.0.0.1 --user=root -e 'CREATE DATABASE cacti_aggregate_test'
          mariadb --host=127.0.0.1 --user=root cacti_aggregate_test < cacti.sql
          cp include/config.php.dist include/config.php
          sed -i "s/\$database_hostname = 'localhost';/\$database_hostname = '127.0.0.1';/" include/config.php
      - name: Validate the gate and include every changed production PHP file
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 tests/tools/test_check_changed_php_coverage.py
          python3 tests/tools/check_changed_php_coverage.py --base "$BASE_COMMIT" \
            --prepare-config tests/phpunit-rrd-capabilities.xml --output-config phpunit-changed.xml
      - name: Exercise native update and graph capability contracts
        working-directory: tests
        env:
          XDEBUG_MODE: coverage
          CACTI_PR_RAW_COVERAGE: ${{ runner.temp }}/request-coverage
          CACTI_AGGREGATE_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=cacti_aggregate_test;charset=utf8mb4'
          CACTI_AGGREGATE_TEST_USER: root
          CACTI_AGGREGATE_TEST_PASSWORD: cactiroot
          BOOST_DB_HOST: 127.0.0.1
          BOOST_DB_PORT: 3306
          BOOST_DB_NAME: cacti_boost_contract
          BOOST_DB_USER: root
          BOOST_DB_PASSWORD: cactiroot
        run: |
          set -euo pipefail
          mkdir -p "$CACTI_PR_RAW_COVERAGE"
          vendor/bin/pest --configuration=../phpunit-changed.xml --coverage-clover=../coverage-changed.xml
          php -d auto_prepend_file="$GITHUB_WORKSPACE/tests/Helpers/RequestCoverage.php" vendor/bin/pest \
            Unit/Core/Boost/BoostArchiveDeletionOwnershipBehaviorTest.php \
            Unit/Core/Boost/BoostFailureAlertBehaviorTest.php \
            Unit/Core/Boost/BoostFailureQueueBehaviorTest.php \
            Unit/Core/Boost/BoostFailureQueueCacheTest.php \
            Unit/Core/Boost/BoostFailureRetryBehaviorTest.php \
            Unit/Core/Boost/BoostFailureRetryDestinationTest.php \
            Unit/Core/Boost/BoostMetadataCacheTest.php \
            Unit/Core/Boost/BoostPollerCoordinationBehaviorTest.php \
            Unit/Core/Boost/BoostPollerDrainBehaviorTest.php \
            Unit/Core/Boost/BoostPollerOutputBehaviorTest.php \
            Unit/Security/Session/SessionHandlerGcTest.php \
            integration/BoostProcessTableMariaDbTest.php
      - name: Exercise Boost lifecycle and failure recovery
        env:
          XDEBUG_MODE: coverage
          CACTI_PR_RAW_COVERAGE: ${{ runner.temp }}/request-coverage
        run: tests/e2e/boost/run-coverage.sh "$PWD"
      - name: Require at least 80 percent of changed executable PHP lines
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 tests/tools/check_changed_php_coverage.py --base "$BASE_COMMIT" \
            --report coverage-changed.xml --request-reports "${{ runner.temp }}/request-coverage" \
            --minimum 80 --json-output coverage-changed.json
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: changed-php-coverage
          path: |
            coverage-changed.xml
            coverage-changed.json
            ${{ runner.temp }}/request-coverage
          if-no-files-found: warn
