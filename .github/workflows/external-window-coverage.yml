name: External window security coverage

on:
  push:
    branches: [1.2.x]
    paths:
      - install/install.js
      - include/layout.js
      - include/themes/*/main.js
      - tests/e2e/filter-search-icons.spec.js
      - tests/e2e/external-window.spec.js
      - tests/e2e/playwright.config.js
      - tests/e2e/package*.json
      - .github/workflows/external-window-coverage.yml
  pull_request:
    branches: [1.2.x]
    paths:
      - install/install.js
      - include/layout.js
      - include/themes/*/main.js
      - tests/e2e/filter-search-icons.spec.js
      - tests/e2e/external-window.spec.js
      - tests/e2e/playwright.config.js
      - tests/e2e/package*.json
      - .github/workflows/external-window-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: External window security statements 100% coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # main (PHP 8.6 stable; after 2.40.0)
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install locked browser test dependencies
        working-directory: tests/e2e
        run: npm ci --ignore-scripts
      - name: Install Chromium
        working-directory: tests/e2e
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify opener isolation and changed-statement coverage
        working-directory: tests/e2e
        run: node node_modules/@playwright/test/cli.js test --config=playwright.config.js external-window.spec.js filter-search-icons.spec.js --workers=1
