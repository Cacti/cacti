name: API Automation Tools Coverage

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/api-automation-tools-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/api_automation_tools.php'
      - 'phpunit-api-automation-tools.xml'
      - 'tests/Coverage/ApiAutomationToolsCoverageTest.php'
      - 'tests/Unit/AutomationPreparedInClauseTest.php'
      - 'tests/fixtures/automation_prepared_in_clause_probe.php'
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/api-automation-tools-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/api_automation_tools.php'
      - 'phpunit-api-automation-tools.xml'
      - 'tests/Coverage/ApiAutomationToolsCoverageTest.php'
      - 'tests/Unit/AutomationPreparedInClauseTest.php'
      - 'tests/fixtures/automation_prepared_in_clause_probe.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-automation-tools-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ALLOW_SUPERUSER: 1

jobs:
  coverage:
    name: API automation tools 100% coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP 8.4 with Xdebug
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: xdebug
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: include/vendor
          key: ${{ runner.os }}-php-api-automation-coverage-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-api-automation-coverage-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Enforce line coverage
        env:
          XDEBUG_MODE: coverage
        run: |
          set -euo pipefail
          include/vendor/bin/pest \
            --configuration=phpunit-api-automation-tools.xml \
            --coverage \
            --coverage-text \
            --min=100
