name: API Automation Tools Coverage

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/api-automation-tools-coverage.yml'
      - '.github/actions/setup-php-composer/**'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/api_automation_tools.php'
      - 'phpunit-api-automation-tools.xml'
      - 'tests/Coverage/ApiAutomationToolsCoverageTest.php'
      - 'tests/Unit/Security/SqlInjection/AutomationPreparedInClauseTest.php'
      - 'tests/fixtures/automation_prepared_in_clause_probe.php'
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/api-automation-tools-coverage.yml'
      - '.github/actions/setup-php-composer/**'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/api_automation_tools.php'
      - 'phpunit-api-automation-tools.xml'
      - 'tests/Coverage/ApiAutomationToolsCoverageTest.php'
      - 'tests/Unit/Security/SqlInjection/AutomationPreparedInClauseTest.php'
      - 'tests/fixtures/automation_prepared_in_clause_probe.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-automation-tools-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: ./.github/workflows/script-coverage.yml
    with:
      job-name: API automation tools 100% coverage
      phpunit-config: phpunit-api-automation-tools.xml
