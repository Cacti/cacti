name: Security Posture

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --only-verified

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check semgrep==1.114.0

      - name: Run Semgrep
        run: |
          set -euo pipefail
          semgrep scan --config p/ci --sarif --output semgrep.sarif . || true

      - name: Upload Semgrep SARIF
        # Fork PRs get a read-only GITHUB_TOKEN without security-events: write, so
        # the upload fails with "Resource not accessible by integration". Skip it
        # there; the SARIF is still kept as an artifact below.
        if: always() && github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Scorecard CLI
        run: |
          set -euo pipefail
          # Use the runner's preinstalled Go; the apt golang-go package is too
          # old to build scorecard and disables toolchain auto-download.
          GOBIN="${HOME}/.local/bin" go install github.com/ossf/scorecard/v5@v5.5.0
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Run Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scorecard --repo="github.com/${{ github.repository }}" --format json --show-details > scorecard.json

      - name: Upload Scorecard artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-report
          path: scorecard.json
          if-no-files-found: ignore

  composer-audit:
    name: Composer dependency audit
    runs-on: ubuntu-24.04
    # Advisories are reported as non-blocking: a newly published upstream CVE
    # must not red every open PR. The audit still runs and writes
    # composer-audit.json (uploaded below), and any advisory is surfaced as a
    # ::warning:: annotation. Fixes land via separate dependency-bump PRs.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Composer
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y composer

      - name: Run Composer audit
        run: |
          set -euo pipefail
          # Cacti ships composer.json but no composer.lock; write a fresh lock
          # from composer.json without downloading packages so audit has a
          # lockfile to inspect. --lock requires an existing lock and exits 3.
          composer update --no-install --no-interaction
          # composer audit exits non-zero when it finds advisories. Capture that
          # exit code without tripping set -e so the JSON is always written, then
          # report the advisory count as a warning and exit 0. Advisories stay
          # visible (annotation + artifact) but do not fail the job.
          audit_rc=0
          composer audit --locked --no-interaction --format=json | tee composer-audit.json || audit_rc=$?
          if [ "${audit_rc}" -ne 0 ]; then
            count="$(jq '(.advisories // {}) | map(length) | add // 0' composer-audit.json 2>/dev/null || echo '?')"
            echo "::warning title=Composer advisories::composer audit found ${count} advisory record(s); see composer-audit.json artifact. Tracked via separate dependency-bump PRs."
          fi

      - name: Upload Composer audit artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-audit-report
          path: composer-audit.json
          if-no-files-found: ignore

  workflow-policy:
    name: Workflow policy checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install policy checker dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Enforce workflow policy
        run: |
          set -euo pipefail
          python3 .github/scripts/check-workflow-policy.py \
            --workflows \
            .github/workflows/security-posture.yml \
            .github/workflows/perf-regression.yml \
            .github/workflows/security-review.yml
