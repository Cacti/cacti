name: Windows PHP data input scripts

on:
  pull_request:
    branches: [1.2.x]
    paths:
      - '.github/workflows/php-data-input-windows.yml'
      - '.github/actions/setup-php-composer/**'
      - 'scripts/ss_*.php'
      - 'lib/poller_script.php'
      - 'lib/functions.php'
      - 'tests/Helpers/DataInputHttpServer.php'
      - 'tests/fixtures/DataInput/**'
      - 'tests/Unit/DataCollection/DataInput/**'
      - 'tests/bootstrap-unit.php'
      - 'tests/Pest.php'
      - 'tests/phpunit-data-input-windows.xml'
      - 'tests/composer.*'
  push:
    branches: [1.2.x]
    paths:
      - '.github/workflows/php-data-input-windows.yml'
      - '.github/actions/setup-php-composer/**'
      - 'scripts/ss_*.php'
      - 'lib/poller_script.php'
      - 'lib/functions.php'
      - 'tests/Helpers/DataInputHttpServer.php'
      - 'tests/fixtures/DataInput/**'
      - 'tests/Unit/DataCollection/DataInput/**'
      - 'tests/bootstrap-unit.php'
      - 'tests/Pest.php'
      - 'tests/phpunit-data-input-windows.xml'
      - 'tests/composer.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-data-input-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows PHP ${{ matrix.php }} data input scripts
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, xml
          cache-dependency-path: tests/composer.lock
          dependency-mode: windows-data-input

      - name: Install locked test dependencies
        working-directory: tests
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Require native Windows PHP
        run: php -r "if (PHP_OS_FAMILY !== 'Windows') { exit(1); } echo PHP_OS_FAMILY, ' ', PHP_VERSION, PHP_EOL;"

      - name: Run portable scripts and unavailable Unix collectors
        working-directory: tests
        # The locked Pest 1 runner uses implicit nullable parameters deprecated in PHP 8.4.
        run: php -d error_reporting=24575 vendor/bin/pest --configuration=phpunit-data-input-windows.xml --colors=never
