name: Plugin install lifecycle

on:
  pull_request:
    branches: [1.2.x]
    paths:
      - 'lib/plugins.php'
      - 'cli/plugin_manage.php'
      - 'tests/integration/PluginInstallLifecycleTest.php'
      - 'tests/integration/fixtures/plugin_install_*.php'
      - '.github/workflows/plugin-install-lifecycle.yml'
  push:
    branches: [1.2.x]
    paths:
      - 'lib/plugins.php'
      - 'cli/plugin_manage.php'
      - 'tests/integration/fixtures/plugin_install_*.php'
      - '.github/workflows/plugin-install-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        database: ['mariadb:10.11', 'mysql:8.4']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_DATABASE: cacti_plugin_test
          MYSQL_ROOT_PASSWORD: fixture-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_mysql, mbstring, gd, intl, gmp, ldap, sockets, xml
      - name: Seed disposable database
        env:
          MYSQL_PWD: fixture-password
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -u root cacti_plugin_test < cacti.sql
          cp include/config.php.dist include/config.php
          cat >> include/config.php <<'PHP'
          $database_hostname = '127.0.0.1';
          $database_default = 'cacti_plugin_test';
          $database_username = 'root';
          $database_password = 'fixture-password';
          PHP
          # PHP variables must reach PHP unchanged.
          # shellcheck disable=SC2016
          php -r '
          require "include/config.php";
          $db = new PDO("mysql:host=127.0.0.1;dbname=cacti_plugin_test", $database_username, $database_password);
          $db->prepare("UPDATE version SET cacti = ?")->execute([trim(file_get_contents("include/cacti_version"))]);
          $db->exec("REPLACE INTO settings (name, value) VALUES (\"install_complete\", \"1\")");
          '
      - name: Verify real plugin API and CLI
        env:
          CACTI_PLUGIN_INSTALL_TEST: '1'
        run: php -d auto_prepend_file= tests/integration/fixtures/plugin_install_lifecycle.php
