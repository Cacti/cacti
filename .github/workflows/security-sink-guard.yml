name: Security Sink Guard

# Architectural guardrail for develop: fails a PR when the inventory of
# dangerous sinks (command execution, dynamic include, unserialize, XML parse,
# header redirect, filesystem write) drifts from the reviewed baseline, or when
# a new architectural hotspot is introduced. This blocks whole vulnerability
# classes at the door instead of relying on per-site review. Refresh the
# baselines intentionally with tests/security/build_sink_inventory.sh and
# tests/security/build_architectural_helper_report.sh --hotspots.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sink-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sink-inventory-guard:
    name: sink and architectural hotspot guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ripgrep
        run: |
          set -euo pipefail
          sudo timeout --signal=TERM 300s apt-get -y \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update
          sudo timeout --signal=TERM 300s apt-get -y \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --no-install-recommends ripgrep

      - name: Verify tracked sink baseline
        run: tests/security/verify_sink_inventory.sh

      - name: Verify no new architectural hotspots
        run: tests/security/verify_architectural_hotspots.sh
