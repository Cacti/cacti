name: RRD Graph Item Coverage

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/rrd-graph-item-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/rrd_graph_item.php'
      - 'lib/rrd.php'
      - 'phpunit-rrd-graph-item.xml'
      - 'tests/Coverage/RrdGraphItemCoverageTest.php'
      - 'tests/Unit/RrdGraphItemFieldContractTest.php'
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/rrd-graph-item-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/rrd_graph_item.php'
      - 'lib/rrd.php'
      - 'phpunit-rrd-graph-item.xml'
      - 'tests/Coverage/RrdGraphItemCoverageTest.php'
      - 'tests/Unit/RrdGraphItemFieldContractTest.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rrd-graph-item-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ALLOW_SUPERUSER: 1

jobs:
  coverage:
    name: RRD graph item 100% coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP 8.4 with Xdebug
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: xdebug
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: include/vendor
          key: ${{ runner.os }}-php-rrd-graph-item-coverage-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-rrd-graph-item-coverage-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Enforce line coverage
        env:
          XDEBUG_MODE: coverage
        run: |
          set -euo pipefail
          include/vendor/bin/pest \
            --configuration=phpunit-rrd-graph-item.xml \
            --coverage \
            --coverage-text \
            --min=100
