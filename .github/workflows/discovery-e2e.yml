name: Discovery regression and e2e

on:
  pull_request:
    paths:
      - 'poller_automation.php'
      - 'lib/api_automation.php'
      - 'include/layout.js'
      - 'lib/html_form.php'
      - 'include/global_form.php'
      - 'include/auth.php'
      - 'lib/auth.php'
      - 'lib/csrf.php'
      - 'auth_login.php'
      - 'cacti.sql'
      - 'install/templates/Generic_SNMP_Device.xml.gz'
      - 'resource/snmp_queries/interface.xml'
      - 'automation_*.php'
      - 'tests/Unit/Core/Automation/**'
      - 'tests/fixtures/automation_*'
      - 'tests/fixtures/discovery_*'
      - 'tests/Helpers/SourceSlice.php'
      - 'tests/Helpers/PhpSource.php'
      - 'tests/Helpers/IsolatedProbe.php'
      - 'lib/snmp.php'
      - 'lib/functions.php'
      - 'lib/poller.php'
      - 'tests/phpunit-discovery.xml'
      - 'tests/Unit/Core/SchedulerMonthlyNextStartTest.php'
      - 'lib/api_scheduler.php'
      - 'tests/js/snmp_controls.test.js'
      - 'tests/e2e/discovery/**'
      - 'tests/e2e/Dockerfile'
      - 'tests/e2e/docker-compose.yml'
      - 'tests/e2e/entrypoint.sh'
      - 'tests/e2e/playwright.config.ts'
      - 'tests/e2e/package*.json'
      - 'tests/fixtures/snmp-coverage/Dockerfile'
      - 'composer.json'
      - 'composer.lock'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'patches/**'
      - '.github/actions/setup-php-composer/**'
      - '.github/workflows/discovery-e2e.yml'
  push:
    branches: [develop, 1.2.x]
    paths:
      - 'poller_automation.php'
      - 'lib/api_automation.php'
      - 'include/layout.js'
      - 'lib/html_form.php'
      - 'include/global_form.php'
      - 'include/auth.php'
      - 'lib/auth.php'
      - 'lib/csrf.php'
      - 'auth_login.php'
      - 'cacti.sql'
      - 'install/templates/Generic_SNMP_Device.xml.gz'
      - 'resource/snmp_queries/interface.xml'
      - 'automation_*.php'
      - 'tests/Unit/Core/Automation/**'
      - 'tests/fixtures/automation_*'
      - 'tests/fixtures/discovery_*'
      - 'tests/Helpers/SourceSlice.php'
      - 'tests/Helpers/PhpSource.php'
      - 'tests/Helpers/IsolatedProbe.php'
      - 'lib/snmp.php'
      - 'lib/functions.php'
      - 'lib/poller.php'
      - 'tests/phpunit-discovery.xml'
      - 'tests/Unit/Core/SchedulerMonthlyNextStartTest.php'
      - 'lib/api_scheduler.php'
      - 'tests/js/snmp_controls.test.js'
      - 'tests/e2e/discovery/**'
      - 'tests/e2e/Dockerfile'
      - 'tests/e2e/docker-compose.yml'
      - 'tests/e2e/entrypoint.sh'
      - 'tests/e2e/playwright.config.ts'
      - 'tests/e2e/package*.json'
      - 'tests/fixtures/snmp-coverage/Dockerfile'
      - 'composer.json'
      - 'composer.lock'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'patches/**'
      - '.github/actions/setup-php-composer/**'
      - '.github/workflows/discovery-e2e.yml'

permissions:
  contents: read

concurrency:
  group: discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
        env:
          MARIADB_ROOT_PASSWORD: discovery-fixture
          MARIADB_DATABASE: discovery_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.3'
          extensions: pdo_mysql, snmp, gd, gmp, intl, ldap, sockets, zip
          install-args: --no-interaction --prefer-dist
      - name: Native discovery regressions (including actual SQL)
        env:
          CACTI_MATCH_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=discovery_fixture
          CACTI_MATCH_DB_USER: root
          CACTI_MATCH_DB_PASSWORD: discovery-fixture
        run: |
          set -euo pipefail
          cd tests
          php ../include/vendor/bin/pest --configuration phpunit-discovery.xml --log-junit discovery-native.xml
          # PHP variables must stay literal for the PHP interpreter.
          # shellcheck disable=SC2016
          php -r '$x=simplexml_load_file("discovery-native.xml"); if (!$x) { exit(1); } $n=0; foreach ($x->xpath("//testsuite[not(testsuite)]") as $s) { $n+=(int)$s["tests"]; if ((int)$s["skipped"] || (int)$s["failures"] || (int)$s["errors"]) { exit(1); } } if (!$n) { exit(1); }'
      - name: Scheduling through the production API
        working-directory: tests
        run: |
          set -euo pipefail
          php ../include/vendor/bin/pest --configuration phpunit.xml Unit/Core/SchedulerMonthlyNextStartTest.php --log-junit discovery-scheduling.xml
          # PHP variables must stay literal for the PHP interpreter.
          # shellcheck disable=SC2016
          php -r '$x=simplexml_load_file("discovery-scheduling.xml"); if (!$x) { exit(1); } $n=0; foreach ($x->xpath("//testsuite[not(testsuite)]") as $s) { $n+=(int)$s["tests"]; if ((int)$s["skipped"] || (int)$s["failures"] || (int)$s["errors"]) { exit(1); } } if (!$n) { exit(1); }'
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: discovery-native
          path: tests/discovery-*.xml
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: SNMP form regression tests
        run: node --test tests/js/snmp_controls.test.js
      - name: Install Chromium system dependencies
        working-directory: tests/e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Actual UI and isolated SNMP discovery
        env:
          HOST_PORT: '18093'
          DISCOVERY_COMPOSE_PROJECT: cacti-discovery-ci
        run: tests/e2e/discovery/run.sh
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: discovery-browser
          path: |
            tests/e2e/test-results/
            /tmp/cacti-discovery-ci-failure.log
