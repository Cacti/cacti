name: Develop theme correctness
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: theme-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    name: Pinned theme fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plugins: ${{ steps.matrix.outputs.plugins }}
      rtm_repository: ${{ steps.matrix.outputs.rtm_repository }}
      rtm_revision: ${{ steps.matrix.outputs.rtm_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate fixture and summary behavior
        run: python3 tests/tools/test_theme_ci.py
      - name: Read immutable fixture manifests
        id: matrix
        run: python3 .github/scripts/theme_ci.py matrix
  core:
    name: Core theme rendering and CSS coverage
    uses: ./.github/workflows/theme-browser-suite.yml
    with:
      suite: core
      base-commit: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
  plugins:
    name: Plugin compatibility (${{ matrix.id }})
    needs: fixtures
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.fixtures.outputs.plugins) }}
    uses: ./.github/workflows/theme-browser-suite.yml
    with:
      suite: plugin
      fixture-id: ${{ matrix.id }}
      fixture-repository: ${{ matrix.repository }}
      fixture-revision: ${{ matrix.revision }}
  rtm:
    name: RTM plugin compatibility
    needs: fixtures
    uses: ./.github/workflows/theme-browser-suite.yml
    with:
      suite: rtm
      fixture-id: rtm
      fixture-repository: ${{ needs.fixtures.outputs.rtm_repository }}
      fixture-revision: ${{ needs.fixtures.outputs.rtm_revision }}
  validation:
    name: Theme validation
    if: always()
    needs: [fixtures, core, plugins, rtm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every suite to complete successfully
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if failed:
              print('::error::Theme validation failed or did not finish: ' + ', '.join(failed))
          sys.exit(bool(failed))
          PY
