name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Build source archive and checksum
        run: |
          mkdir --parents dist
          archive="dist/cacti-${RELEASE_TAG}.tar.gz"
          git archive --format=tar.gz --prefix="cacti-${RELEASE_TAG}/" "$RELEASE_TAG" > "$archive"
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/cacti-${{ env.RELEASE_TAG }}.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --title "$RELEASE_TAG" --generate-notes --verify-tag
