name: Security Review

# Runs the security review prompt against the PR diff, grep hits on changed
# PHP files, and excerpts from historically vulnerable hotspot files. Posts
# findings as a PR comment and fails the job when the review recommends
# blocking the PR.
#
# Requires the ANTHROPIC_API_KEY repository secret to be configured.
# Fork PRs are excluded explicitly. Head files are read only as Git blobs.
# The workflow, runner, and prompt always come from the trusted base revision.

# This privileged trigger is needed for the API key and PR comments. Checkout
# is restricted to the trusted event SHA; PR blobs are never checked out or executed.
on: # zizmor: ignore[dangerous-triggers] -- trusted base runner, same-repository PRs, no head-code execution
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: security review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: write   # security_review.py posts via the issues comments endpoint
    # Skip drafts. The secret check cannot live in a job-level `if:` because the
    # `secrets` context is not available there; it is evaluated per step via env.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Checkout trusted base
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # For pull_request_target, github.sha is the trusted target revision.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Fetch objects only. No head checkout, submodules, dependencies, caches,
      # textconv, external diff drivers, or scripts from the pull request.
      - name: Collect PR data using the trusted base runner
        if: env.HAS_KEY == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Read-only authentication is scoped to this command; checkout does
          # not leave credentials available to the review runner.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-recurse-submodules --no-tags origin "$PR_HEAD_SHA"
          unset auth GH_TOKEN
          python3 .github/scripts/collect_security_review.py

      - name: Run security review
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          SECURITY_PROMPT_FILE: .github/prompts/security-review.md
          PR_DIFF_FILE: ${{ runner.temp }}/cacti-security-review/pr.diff
          GREP_HITS_FILE: ${{ runner.temp }}/cacti-security-review/grep_hits.txt
          HOTSPOT_FILE: ${{ runner.temp }}/cacti-security-review/hotspot_contents.txt
        run: python3 .github/scripts/security_review.py
