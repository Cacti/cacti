name: Update stale pull request branches

# Open PRs drift behind develop/1.2.x the longer they sit unreviewed, and a
# large gap turns an otherwise clean PR into a merge conflict once someone
# finally looks at it. This walks every open PR and, for any that GitHub
# reports as BEHIND its base, calls the same update-branch endpoint behind
# the PR page's "Update branch" button (a merge, not a rebase, so it never
# needs a force-push). PRs that are DIRTY (a real conflict) or already
# current are left alone; fork PRs whose author hasn't enabled "Allow edits
# from maintainers" will fail the API call, which is expected and logged,
# not treated as a job failure.

on:
  schedule:
    - cron: '40 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-branch-update
  cancel-in-progress: false

jobs:
  update-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Update PRs that are behind their base branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_numbers='[]'
          page=1

          while true; do
            page_prs=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100&page=${page}" --jq '[.[] | .number]')

            pr_numbers=$(jq -s '.[0] + .[1]' <(echo "$pr_numbers") <(echo "$page_prs"))

            if [ "$(echo "$page_prs" | jq 'length')" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
          done

          updated=0
          skipped=0
          failed=0

          for number in $(echo "$pr_numbers" | jq -r '.[]'); do
            # mergeStateStatus reports CLEAN for branches the compare API still
            # counts as behind, so ask compare directly.
            refs=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --jq '[.base.ref, .head.label] | @tsv')
            base_ref=$(printf '%s' "$refs" | cut -f1)
            head_ref=$(printf '%s' "$refs" | cut -f2)

            behind=$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${base_ref}...${head_ref}" \
              --jq '.behind_by' 2>/dev/null || echo 0)

            if [ "${behind:-0}" -eq 0 ]; then
              echo "skip #$number: not behind"
              skipped=$((skipped + 1))
              continue
            fi

            echo "updating #$number (behind base by $behind)"
            # Rebase rather than merge. A merge update adds a commit per run, so
            # each branch accumulates snapshots of old base and re-conflicts on
            # every shared file it carries.
            if gh api -X PUT \
                -H "Accept: application/vnd.github+json" \
                -f update_method=rebase \
                "repos/${GITHUB_REPOSITORY}/pulls/${number}/update-branch"; then
              updated=$((updated + 1))
            else
              echo "failed #$number: update-branch call rejected (real conflict, or fork author hasn't enabled maintainer edits)"
              failed=$((failed + 1))
            fi

            sleep 2
          done

          echo "updated=$updated skipped=$skipped failed=$failed"
