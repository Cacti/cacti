name: Update stale pull request branches

# Open PRs drift behind develop/1.2.x the longer they sit unreviewed, and a
# large gap turns an otherwise clean PR into a merge conflict once someone
# finally looks at it. This walks every open PR and, for any that the compare
# API reports as behind its base, calls the same update-branch endpoint behind
# the PR page's "Update branch" button, with update_method=rebase. A rebase
# rewrites the head branch, and branch protection dismisses stale approvals
# on push, so PRs whose review decision is APPROVED are skipped rather than
# sent back for review. PRs with a real conflict make the API call fail; fork
# PRs whose author hasn't enabled "Allow edits from maintainers" fail the same
# way. Both are expected and logged, not treated as a job failure.
#
# The rebase is pushed with GITHUB_TOKEN, and GitHub does not start workflow
# runs for events caused by that token, so a rebased PR keeps the checks from
# its previous head until someone pushes or re-runs them.

on:
  schedule:
    - cron: '40 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-branch-update
  cancel-in-progress: false

jobs:
  update-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Update PRs that are behind their base branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_numbers='[]'
          page=1

          while true; do
            page_prs=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100&page=${page}" --jq '[.[] | .number]')

            pr_numbers=$(jq -s '.[0] + .[1]' <(echo "$pr_numbers") <(echo "$page_prs"))

            if [ "$(echo "$page_prs" | jq 'length')" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
          done

          updated=0
          skipped=0
          failed=0
          errored=0

          for number in $(echo "$pr_numbers" | jq -r '.[]'); do
            # mergeStateStatus reports CLEAN for branches the compare API still
            # counts as behind, so ask compare directly.
            refs=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --jq '[.base.ref, .head.label] | @tsv')
            base_ref=$(printf '%s' "$refs" | cut -f1)
            head_ref=$(printf '%s' "$refs" | cut -f2)

            # Count a failed compare on its own so an API error is not reported
            # as a branch that is already current.
            if ! behind=$(gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${base_ref}...${head_ref}" \
                --jq '.behind_by'); then
              echo "error #$number: compare ${base_ref}...${head_ref} failed"
              errored=$((errored + 1))
              continue
            fi

            if [ "${behind:-0}" -eq 0 ]; then
              echo "skip #$number: not behind"
              skipped=$((skipped + 1))
              continue
            fi

            review=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" \
              --json reviewDecision --jq '.reviewDecision')

            if [ "$review" = "APPROVED" ]; then
              echo "skip #$number: approved, a rebase would dismiss the approval"
              skipped=$((skipped + 1))
              continue
            fi

            echo "updating #$number (behind base by $behind)"
            # Rebase rather than merge. A merge update adds a commit per run, so
            # each branch accumulates snapshots of old base and re-conflicts on
            # every shared file it carries.
            if gh api -X PUT \
                -H "Accept: application/vnd.github+json" \
                -f update_method=rebase \
                "repos/${GITHUB_REPOSITORY}/pulls/${number}/update-branch"; then
              updated=$((updated + 1))
            else
              echo "failed #$number: update-branch call rejected (real conflict, or fork author hasn't enabled maintainer edits)"
              failed=$((failed + 1))
            fi

            sleep 2
          done

          echo "updated=$updated skipped=$skipped failed=$failed errored=$errored"
