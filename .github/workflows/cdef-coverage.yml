name: CDEF Coverage

on:
  push:
    branches: [1.2.x]
    paths:
      - '.github/workflows/cdef-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'cdef.php'
      - 'lib/cdef.php'
      - 'phpunit-cdef.xml'
      - 'phpunit-cdef-contract.xml'
      - 'tests/composer.json'
      - 'tests/Coverage/CdefCoverageTest.php'
      - 'tests/Helpers/CdefCoverageBootstrap.php'
      - 'tests/Unit/Ui/Cdef/CdefControllerContractTest.php'
  pull_request:
    branches: [1.2.x]
    paths:
      - '.github/workflows/cdef-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'cdef.php'
      - 'lib/cdef.php'
      - 'phpunit-cdef.xml'
      - 'phpunit-cdef-contract.xml'
      - 'tests/composer.json'
      - 'tests/Coverage/CdefCoverageTest.php'
      - 'tests/Helpers/CdefCoverageBootstrap.php'
      - 'tests/Unit/Ui/Cdef/CdefControllerContractTest.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdef-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ALLOW_SUPERUSER: 1

jobs:
  coverage:
    name: lib/cdef.php 100% coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP 8.1 with Xdebug
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: xdebug
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tests/vendor
          key: ${{ runner.os }}-php-cdef-coverage-${{ hashFiles('tests/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-cdef-coverage-

      - name: Install dependencies
        run: composer install --working-dir=tests --prefer-dist --no-progress --no-interaction

      - name: Enforce line coverage
        working-directory: tests
        env:
          XDEBUG_MODE: coverage
        run: |
          set -euo pipefail
          php -d xdebug.mode=coverage vendor/bin/pest \
            --configuration=../phpunit-cdef.xml \
            Coverage/CdefCoverageTest.php \
            --coverage \
            --coverage-text \
            --min=100

      - name: Run controller contract tests
        working-directory: tests
        run: vendor/bin/pest --configuration=../phpunit-cdef-contract.xml
