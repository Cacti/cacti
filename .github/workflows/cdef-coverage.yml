name: CDEF Coverage

on:
  push:
    branches: [1.2.x]
    paths:
      - '.github/workflows/cdef-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'cdef.php'
      - 'lib/cdef.php'
      - 'phpunit-cdef.xml'
      - 'phpunit-cdef-contract.xml'
      - 'phpunit-cdef-integration.xml'
      - 'tests/composer.json'
      - 'tests/composer.lock'
      - 'tests/.htaccess'
      - 'tests/Coverage/CdefCoverageTest.php'
      - 'tests/Helpers/CdefCoverageBootstrap.php'
      - 'tests/Helpers/CdefDatabaseProbe.php'
      - 'tests/Unit/Ui/Cdef/CdefControllerContractTest.php'
      - 'tests/integration/CdefDatabaseIntegrationTest.php'
  pull_request:
    branches: [1.2.x]
    paths:
      - '.github/workflows/cdef-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'cdef.php'
      - 'lib/cdef.php'
      - 'phpunit-cdef.xml'
      - 'phpunit-cdef-contract.xml'
      - 'phpunit-cdef-integration.xml'
      - 'tests/composer.json'
      - 'tests/composer.lock'
      - 'tests/.htaccess'
      - 'tests/Coverage/CdefCoverageTest.php'
      - 'tests/Helpers/CdefCoverageBootstrap.php'
      - 'tests/Helpers/CdefDatabaseProbe.php'
      - 'tests/Unit/Ui/Cdef/CdefControllerContractTest.php'
      - 'tests/integration/CdefDatabaseIntegrationTest.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdef-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ALLOW_SUPERUSER: 1

jobs:
  coverage:
    name: lib/cdef.php 100% coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430 # 11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cacti_test
          MARIADB_USER: cacti
          MARIADB_PASSWORD: cacti
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP 8.1 with Xdebug
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: xdebug
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tests/vendor
          key: ${{ runner.os }}-php-cdef-coverage-${{ hashFiles('tests/composer.lock') }}

      - name: Install dependencies
        run: composer install --working-dir=tests --prefer-dist --no-progress --no-interaction

      - name: Validate locked test dependencies
        run: composer validate --working-dir=tests --strict

      - name: Enforce line coverage
        working-directory: tests
        env:
          XDEBUG_MODE: coverage
        run: |
          set -euo pipefail
          php -d xdebug.mode=coverage vendor/bin/pest \
            --configuration=../phpunit-cdef.xml \
            Coverage/CdefCoverageTest.php \
            --coverage \
            --coverage-text \
            --min=100

      - name: Run controller contract tests
        working-directory: tests
        run: vendor/bin/pest --configuration=../phpunit-cdef-contract.xml

      - name: Run MariaDB integration coverage
        working-directory: tests
        env:
          CACTI_CDEF_REAL_DB: '1'
          CACTI_TEST_DB_HOST: 127.0.0.1
          CACTI_TEST_DB_PORT: '3306'
          CACTI_TEST_DB_NAME: cacti_test
          CACTI_TEST_DB_USER: cacti
          CACTI_TEST_DB_PASS: cacti
        run: vendor/bin/pest --configuration=../phpunit-cdef-integration.xml
