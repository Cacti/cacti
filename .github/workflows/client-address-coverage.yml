name: Client Address Coverage

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/script-coverage.yml'
      - '.github/workflows/client-address-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/client_address.php'
      - 'lib/ip.php'
      - 'lib/functions.php'
      - 'tests/phpunit-client-address.xml'
      - 'tests/Coverage/ClientAddressCoverageTest.php'
      - 'tests/Unit/Security/Misc/GetClientAddrTest.php'
      - 'tests/Unit/Core/IpInCidrTest.php'
      - 'tests/Unit/Core/Automation/IpRangeMembershipTest.php'
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/script-coverage.yml'
      - '.github/workflows/client-address-coverage.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'lib/client_address.php'
      - 'lib/ip.php'
      - 'lib/functions.php'
      - 'tests/phpunit-client-address.xml'
      - 'tests/Coverage/ClientAddressCoverageTest.php'
      - 'tests/Unit/Security/Misc/GetClientAddrTest.php'
      - 'tests/Unit/Core/IpInCidrTest.php'
      - 'tests/Unit/Core/Automation/IpRangeMembershipTest.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-address-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: ./.github/workflows/script-coverage.yml
    with:
      job-name: Client address 100% coverage
      phpunit-config: tests/phpunit-client-address.xml
      php-version: '8.4'
