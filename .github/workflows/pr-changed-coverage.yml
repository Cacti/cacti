name: PR changed-code coverage

on:
  pull_request:
    paths:
      - 'auth_2fa.php'
      - 'auth_resetpassword.php'
      - 'package_import.php'
      - 'package_repos.php'
      - 'lib/functions.php'
      - 'lib/script_server.php'
      - 'lib/SnmpStateStore.php'
      - 'lib/poller.php'
      - 'script_server.php'
      - 'cmd.php'
      - 'cmd_realtime.php'
      - 'remote_agent.php'
      - 'scripts/ss_net_snmp_disk_*.php'
      - 'tests/Unit/DataCollection/Poller/ScriptServer*'
      - 'tests/Unit/Scripts/NetSnmpDiskStateFileTest.php'
      - 'lib/html.php'
      - 'include/layout.js'
      - 'include/css/graph_drilldown.css'
      - 'include/themes/**/main.css'
      - 'tests/Helpers/FixtureCoverage.php'
      - 'tests/Helpers/RequestCoverage.php'
      - 'tests/Helpers/SourceSlice.php'
      - 'tests/fixtures/Core/**'
      - 'tests/e2e/tests/**'
      - 'tests/tools/check_changed_php_coverage.py'
      - 'tests/tools/normalize_request_coverage.php'
      - 'tests/tools/report_changed_coverage.py'
      - 'tests/tools/run_request_coverage.sh'
      - 'tests/tools/run_pr_change_tests.sh'
      - '.github/workflows/pr-changed-coverage.yml'
  workflow_dispatch:
    inputs:
      base_commit:
        description: Base commit for changed-line coverage
        required: true

permissions:
  contents: read

jobs:
  changed-coverage:
    needs: windows-script-server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up PHP and Cacti test dependencies
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.3'
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring, dom
          coverage: xdebug
          ini-values: memory_limit=1G
          dependency-mode: locked-tests
          install-args: --prefer-dist --no-progress --no-interaction
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install browser test dependencies
        if: hashFiles('tests/e2e/tests/fixture-coverage.js') != ''
        working-directory: tests/e2e
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Collect native Windows coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-script-server-coverage-*
          path: ${{ runner.temp }}/platform-coverage
          merge-multiple: true
      - name: Run changed-code tests and require 100 percent changed-line coverage
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || inputs.base_commit }}
          CACTI_COVERAGE_DIR: ${{ runner.temp }}/cacti-changed-coverage
          CACTI_PR_PLATFORM_COVERAGE_DIR: ${{ runner.temp }}/platform-coverage
        run: bash tests/tools/run_pr_change_tests.sh "$BASE_COMMIT"
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: changed-code-coverage
          path: |
            ${{ runner.temp }}/cacti-changed-coverage
            tests/e2e/test-results
          if-no-files-found: warn

  windows-script-server:
    name: Native Windows Script Server (PHP ${{ matrix.php }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up locked PHP test dependencies
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring, dom, pdo_sqlite, pdo_mysql, sockets, sqlite3
          ini-values: memory_limit=2G
          dependency-mode: locked-tests
          # POSIX and pcntl are unavailable on native Windows; the applicable
          # Unix signal and socket contracts declare explicit platform skips.
          install-args: --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-pcntl --ignore-platform-req=ext-posix
      - name: Exercise native pipe framing, process recovery and state storage
        timeout-minutes: 5
        shell: bash
        env:
          XDEBUG_MODE: coverage
          CACTI_PR_RAW_COVERAGE: ${{ runner.temp }}/native-script-server-${{ matrix.php }}
        run: |
          set -euo pipefail
          php -r 'if (!mkdir(getenv("CACTI_PR_RAW_COVERAGE"), 0700, true) && !is_dir(getenv("CACTI_PR_RAW_COVERAGE"))) { exit(1); }'
          php -d auto_prepend_file=tests/Helpers/RequestCoverage.php include/vendor/bin/pest --configuration=tests/phpunit.xml --debug \
            tests/Unit/DataCollection/Poller/ScriptServerProcessTest.php \
            tests/Unit/DataCollection/Poller/ScriptServerRequestTest.php \
            tests/Unit/DataCollection/Poller/ScriptServerResponseTest.php \
            tests/Unit/Scripts/NetSnmpDiskStateFileTest.php
          php tests/fixtures/Core/CollectorEntrypointContracts.php cgi
      - name: Preserve native Windows evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-script-server-coverage-${{ matrix.php }}
          path: ${{ runner.temp }}/native-script-server-${{ matrix.php }}/*.json
          if-no-files-found: error
