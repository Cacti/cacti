# +-------------------------------------------------------------------------+
# | CSP nonce migration: unit + integration + (deferred) E2E tests.         |
# | Scoped to the branch and the CSP-relevant files so it does not run on   |
# | every unrelated change.                                                 |
# +-------------------------------------------------------------------------+

name: CSP Migration CI

on:
  push:
    branches:
      - security/csp-nonce-migration
  pull_request:
    paths:
      - lib/headers_secure.php
      - lib/csp_report_endpoint.php
      - include/global.php
      - include/global_settings.php
      - csp_report.php
      - tests/integration/**
      - tests/e2e/**
      - .github/workflows/csp-e2e.yml

permissions:
  contents: read

concurrency:
  group: csp-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (CactiSecureHeaders, CSP report endpoint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231  # v2.31.1
        with:
          php-version: '7.4'
          extensions: mbstring, intl, json, openssl, curl, xml
          coverage: none

      - name: Composer install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install test runner (Pest)
        run: |
          composer require --dev --no-interaction --no-progress \
            pestphp/pest:^1.23

      - name: Run Pest unit tests (fall back to PHPUnit)
        run: |
          set -euo pipefail
          unit_files="tests/Unit/HeadersSecureTest.php tests/Unit/CspReportEndpointTest.php"
          if [ -x ./vendor/bin/pest ]; then
            ./vendor/bin/pest $unit_files
          elif [ -x ./include/vendor/bin/pest ]; then
            ./include/vendor/bin/pest $unit_files
          elif [ -x ./vendor/bin/phpunit ]; then
            ./vendor/bin/phpunit $unit_files
          else
            echo "No Pest/PHPUnit runner found" >&2
            exit 1
          fi

  integration:
    name: Integration tests (php -S harness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231  # v2.31.1
        with:
          php-version: '7.4'
          extensions: mbstring, intl, json, openssl, curl, xml
          coverage: none

      - name: Composer install
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install test runner (Pest)
        run: |
          composer require --dev --no-interaction --no-progress \
            pestphp/pest:^1.23

      - name: Run Pest integration tests (fall back to PHPUnit)
        run: |
          set -euo pipefail
          if [ -x ./vendor/bin/pest ]; then
            ./vendor/bin/pest tests/integration/
          elif [ -x ./include/vendor/bin/pest ]; then
            ./include/vendor/bin/pest tests/integration/
          elif [ -x ./vendor/bin/phpunit ]; then
            ./vendor/bin/phpunit tests/integration/
          else
            echo "No Pest/PHPUnit runner found" >&2
            exit 1
          fi

  e2e:
    name: Playwright E2E (docker-compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb  # v3.3.0

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with:
          node-version: '20'

      - name: Build and start compose stack
        working-directory: tests/e2e
        run: docker compose up -d --build

      - name: Wait for Cacti to respond on :8080
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8080/ | grep -qE '^(200|302)$'; then
              echo "Cacti is up after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Cacti did not respond on :8080 within 120s" >&2
          docker compose -f tests/e2e/docker-compose.yml logs --tail=200 || true
          exit 1

      - name: Install Playwright dependencies
        working-directory: tests/e2e
        run: npm install

      - name: Install Playwright browser (chromium)
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: playwright-test-results
          path: tests/e2e/test-results
          retention-days: 7

      - name: Tear down compose stack
        if: always()
        working-directory: tests/e2e
        run: docker compose down -v
