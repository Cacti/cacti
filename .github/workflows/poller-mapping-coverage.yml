name: Poller mapping cache coverage

on:
  pull_request:
    paths:
      - 'lib/poller.php'
      - 'lib/snmp.php'
      - 'tests/Unit/DataCollection/Snmp/SnmpWalkEmptyOidTest.php'
      - 'tests/fixtures/Core/SnmpWalkOidGuard.php'
      - 'tests/Helpers/IsolatedProbe.php'
      - 'tests/Unit/PollerMappingCacheTest.php'
      - 'tests/fixtures/PollerMappingCache.php'
      - 'tests/Helpers/SourceSlice.php'
      - 'tests/Helpers/RequestCoverage.php'
      - 'tests/Helpers/DataQueryHarness.php'
      - 'tests/Unit/DataCollection/DataQuery/**'
      - 'tests/integration/DataQueryReindexTest.php'
      - 'tests/tools/check_changed_php_coverage.py'
      - 'tests/tools/test_check_changed_php_coverage.py'
      - 'tests/phpunit-poller-mapping.xml'
      - '.github/workflows/poller-mapping-coverage.yml'

permissions:
  contents: read

jobs:
  coverage:
    name: Changed PHP lines >= 80%
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_DATABASE: cacti_dq_test
          MARIADB_ROOT_PASSWORD: cactiroot
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.3'
          coverage: xdebug
          extensions: curl, dom, mbstring, pdo_mysql, xml
          ini-values: memory_limit=2G
          dependency-mode: locked-maintenance-pr-coverage
          cache-dependency-path: tests/composer.lock
      - name: Install locked test dependencies
        run: composer install --working-dir=tests --prefer-dist --no-progress --no-interaction
      - name: Validate the gate and include every changed production PHP file
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 tests/tools/test_check_changed_php_coverage.py
          python3 tests/tools/check_changed_php_coverage.py --base "$BASE_COMMIT" \
            --prepare-config tests/phpunit-poller-mapping.xml --output-config phpunit-changed.xml
      - name: Exercise poller cache and SNMP OID guards
        working-directory: tests
        env:
          XDEBUG_MODE: coverage
          CACTI_PR_RAW_COVERAGE: ${{ runner.temp }}/request-coverage
        run: |
          set -euo pipefail
          mkdir -p "$CACTI_PR_RAW_COVERAGE"
          vendor/bin/pest --configuration=../phpunit-changed.xml --coverage-clover=../coverage-changed.xml
      - name: Exercise data query discovery and reindex contracts
        working-directory: tests
        env:
          XDEBUG_MODE: coverage
          CACTI_PR_RAW_COVERAGE: ${{ runner.temp }}/request-coverage
          CACTI_DQ_DB_HOST: 127.0.0.1
          CACTI_DQ_DB_PORT: 3306
          CACTI_DQ_DB_NAME: cacti_dq_test
          CACTI_DQ_DB_USER: root
          CACTI_DQ_DB_PASSWORD: cactiroot
        run: |
          set -euo pipefail
          mkdir -p "$CACTI_PR_RAW_COVERAGE"
          php -d auto_prepend_file="$GITHUB_WORKSPACE/tests/Helpers/RequestCoverage.php" vendor/bin/pest \
            integration/DataQueryReindexTest.php \
            Unit/DataCollection/DataQuery/DataQueryIndexLookupTest.php
      - name: Capture native poller mapping coverage
        env:
          XDEBUG_MODE: coverage
          CACTI_PR_RAW_COVERAGE: ${{ runner.temp }}/request-coverage
        run: |
          set -euo pipefail
          php tests/fixtures/PollerMappingCache.php
          php tests/fixtures/PollerMappingCache.php retry
          php tests/fixtures/Core/SnmpWalkOidGuard.php
      - name: Require at least 80 percent of changed executable PHP lines
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 tests/tools/check_changed_php_coverage.py --base "$BASE_COMMIT" \
            --report coverage-changed.xml --request-reports "${{ runner.temp }}/request-coverage" \
            --minimum 80 --json-output coverage-changed.json
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: changed-php-coverage
          path: |
            coverage-changed.xml
            coverage-changed.json
            ${{ runner.temp }}/request-coverage
          if-no-files-found: warn
