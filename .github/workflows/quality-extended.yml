  sql-interpolation-ratchet:
    name: sql interpolation ratchet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Block new unparameterised SQL value interpolation
        run: php tests/tools/sql_interpolation_audit.php --check

  validator-constraint-ratchet:
    name: validator constraint ratchet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Block new undocumented no-op input validation
        run: php tests/tools/validator_constraint_audit.php --check

  unit-coverage:
    name: pest coverage gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP 8.4 with Xdebug
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.37.2
        with:
          php-version: '8.4'
          coverage: xdebug
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring
          ini-values: post_max_size=256M, max_execution_time=60

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: include/vendor
          key: ${{ runner.os }}-php-coverage-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-coverage-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Re-enabled: disabled since #6874 (2026-03) pending cleanup of pre-existing
      # issues. Verified the Unit+integration suite passes clean against current
      # develop, fixed the coverage-scope/enforcement-parsing bugs that were
      # silently making this step a no-op, and confirmed real enforcement works.
      - name: Run Pest with coverage
        run: |
          set -euo pipefail
          include/vendor/bin/pest --display-warnings --coverage-clover=coverage.xml \
            --coverage-text --testsuite=Unit,Integration | tee coverage-summary.txt

      - name: Enforce minimum statement coverage
        run: |
          set -euo pipefail
          php -r '
          $min = (float) getenv("COVERAGE_MIN_STATEMENT_PCT");
          if (!file_exists("coverage.xml")) {
              fwrite(STDERR, "coverage.xml was not generated.\n");
              exit(1);
          }
          $xml = @simplexml_load_file("coverage.xml");
          if ($xml === false) {
              fwrite(STDERR, "Failed to parse coverage.xml.\n");
              exit(1);
          }
          $metrics = $xml->project->metrics ?? null;
          if ($metrics === null || !isset($metrics["statements"]) || !isset($metrics["coveredstatements"])) {
              fwrite(STDERR, "Could not determine statement coverage from coverage.xml.\n");
              exit(1);
          }
          $statements = (int) $metrics["statements"];
          $covered = (int) $metrics["coveredstatements"];
          if ($statements <= 0) {
              fwrite(STDERR, "coverage.xml reports zero statements.\n");
              exit(1);
          }
          $pct = ($covered / $statements) * 100.0;
          printf("Statement coverage: %.2f%% (minimum %.2f%%)\n", $pct, $min);
          if ($pct + 1e-9 < $min) {
              fwrite(STDERR, "Coverage gate failed.\n");
              exit(1);
          }
          '

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: php-coverage-report
          path: |
            coverage.xml
            coverage-summary.txt
          if-no-files-found: ignore
