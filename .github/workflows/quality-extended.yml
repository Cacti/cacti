name: Extended PHP Quality

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-extended-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_ALLOW_SUPERUSER: 1
  # 10.0 was an unverified placeholder from #6874 (coverage.xml was never actually
  # produced back then, see the two bugs fixed alongside this comment). Measured
  # statement coverage on develop today is ~1.73% (788/45456 via tests/Unit +
  # tests/integration). Set below that measured baseline so the gate catches
  # regressions without failing on day one; raise as real coverage grows.
  COVERAGE_MIN_STATEMENT_PCT: '1.5'

