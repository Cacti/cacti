name: CSRF Action Coverage

on:
  push:
    branches: [1.2.x]
    paths:
      - '.github/workflows/csrf-action-coverage.yml'
      - 'include/global.php'
      - 'include/layout.js'
      - '**/*.php'
      - 'tests/phpunit-csrf.xml'
      - 'tests/Unit/Security/Csrf/ItemActionPostOnlyTest.php'
      - 'tests/js/csrf_post_actions.test.js'
  pull_request:
    branches: [1.2.x]
    paths:
      - '.github/workflows/csrf-action-coverage.yml'
      - 'include/global.php'
      - 'include/layout.js'
      - '**/*.php'
      - 'tests/phpunit-csrf.xml'
      - 'tests/Unit/Security/Csrf/ItemActionPostOnlyTest.php'
      - 'tests/js/csrf_post_actions.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csrf-action-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  csrf-actions:
    name: POST guard and browser submission
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 4.4.0
        with:
          node-version: '22'

      - name: Install test dependencies
        run: composer install --working-dir=tests --prefer-dist --no-progress --no-interaction

      - name: Verify guarded actions and links
        working-directory: tests
        run: vendor/bin/pest --configuration=phpunit-csrf.xml

      - name: Verify browser POST construction
        run: node --test tests/js/csrf_post_actions.test.js
