name: Unprivileged FPM runtime

on:
  pull_request:
    paths:
      - tests/e2e/Dockerfile
      - tests/e2e/entrypoint.sh
      - tests/e2e/docker-compose.yml
      - tests/e2e/test-fpm-user.sh
      - .github/workflows/docker-fpm-user.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fpm-user:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use the official Docker Hub image cache
        run: |
          set -euo pipefail
          configuration="$RUNNER_TEMP/cacti-docker-daemon.json"
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json | tee "$configuration" > /dev/null
          else
            printf '%s\n' '{}' > "$configuration"
          fi
          jq '."registry-mirrors" = (["https://mirror.gcr.io"] + (."registry-mirrors" // []) | unique)' "$configuration" > "$configuration.tmp"
          sudo install -m 644 "$configuration.tmp" /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Build Cacti FPM image for the checkout owner
        run: |
          docker build --build-arg CACTI_E2E_UID=1001 -f tests/e2e/Dockerfile -t cacti-fpm-user tests/e2e
      - name: Verify unprivileged FPM master and workers
        run: bash tests/e2e/test-fpm-user.sh cacti-fpm-user 1001
