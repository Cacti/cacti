name: Installer coverage

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/installer-coverage.yml'
      - '.github/actions/setup-php-composer/**'
      - '.github/actions/setup-ci-docker/**'
      - 'composer.json'
      - 'composer.lock'
      - 'cacti.sql'
      - 'cli/convert_tables.php'
      - 'cli/install_cacti.php'
      - 'cli/prepare_install.sh'
      - 'cli/upgrade_database.php'
      - 'docker/**'
      - 'install/**'
      - 'lib/import.php'
      - 'lib/installer.php'
      - 'lib/Installer/**'
      - 'lib/utility.php'
      - 'tests/phpunit-installer.xml'
      - 'tests/Unit/Installer/**'
      - 'tests/Unit/Security/Csrf/InstallerCsrfRecoveryTest.php'
      - 'tests/e2e/installer_resilience_docker.sh'
      - 'tests/e2e/installer_failure_paths.php'
      - 'tests/e2e/installer_populated_fixture.sql'
      - 'tests/e2e/installer_application_check.sh'
      - 'tests/e2e/tests/installer-upgrade.spec.ts'
      - 'tests/e2e/package-lock.json'
      - 'tests/e2e/ldap/**'
      - 'tests/fixtures/InstallerCliProbe.php'
      - 'tests/fixtures/InstallerPlugin/**'
      - 'tests/integration/Installer*.php'
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/installer-coverage.yml'
      - '.github/actions/setup-php-composer/**'
      - '.github/actions/setup-ci-docker/**'
      - 'composer.json'
      - 'composer.lock'
      - 'cacti.sql'
      - 'cli/convert_tables.php'
      - 'cli/install_cacti.php'
      - 'cli/prepare_install.sh'
      - 'cli/upgrade_database.php'
      - 'docker/**'
      - 'install/**'
      - 'lib/import.php'
      - 'lib/installer.php'
      - 'lib/Installer/**'
      - 'lib/utility.php'
      - 'tests/phpunit-installer.xml'
      - 'tests/Unit/Installer/**'
      - 'tests/Unit/Security/Csrf/InstallerCsrfRecoveryTest.php'
      - 'tests/e2e/installer_resilience_docker.sh'
      - 'tests/e2e/installer_failure_paths.php'
      - 'tests/e2e/installer_populated_fixture.sql'
      - 'tests/e2e/installer_application_check.sh'
      - 'tests/e2e/tests/installer-upgrade.spec.ts'
      - 'tests/e2e/package-lock.json'
      - 'tests/e2e/ldap/**'
      - 'tests/fixtures/InstallerCliProbe.php'
      - 'tests/fixtures/InstallerPlugin/**'
      - 'tests/integration/Installer*.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: installer unit and contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP and Cacti test dependencies
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.3'
          coverage: xdebug
          extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring
          dependency-mode: locked-tests
          install-args: --prefer-dist --no-progress --no-interaction

      - name: Run installer unit tests
        env:
          XDEBUG_MODE: coverage
        run: |
          set -euo pipefail
          composer test -- --colors=never \
            --configuration=tests/phpunit-installer.xml \
            --testsuite='Installer Unit' \
            --fail-on-empty-test-suite \
            --fail-on-warning \
            --coverage \
            --coverage-text \
            --coverage-clover installer-unit-coverage.xml \
            --min=2

      - name: Run installer integration contracts
        run: |
          set -euo pipefail
          composer test -- --colors=never \
            --configuration=tests/phpunit-installer.xml \
            --testsuite='Installer Integration' \
            --fail-on-empty-test-suite \
            --fail-on-warning

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-unit-coverage
          path: installer-unit-coverage.xml
          if-no-files-found: error

  docker-integration:
    strategy:
      fail-fast: false
      matrix:
        source: ['1.2.22', '1.2.31']
        database: ['mariadb:10.11', 'mariadb:11.8']
    name: installer PHP 8.4 / ${{ matrix.database }} / upgrade from ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker with the public registry cache
        uses: ./.github/actions/setup-ci-docker

      - name: Set up the frontend test runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Prepare the locked browser test dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run postinstall
          npm --prefix tests/e2e ci --ignore-scripts --no-audit --no-fund
          cd tests/e2e
          npx --no-install playwright install --with-deps chromium

      - name: Run fresh, populated upgrade, CLI, and background scenarios
        env:
          INSTALLER_SOURCE_VERSION: ${{ matrix.source }}
          INSTALLER_DB_IMAGE: ${{ matrix.database }}
        run: tests/e2e/installer_resilience_docker.sh

      - name: Upload browser upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-browser-${{ matrix.source }}-${{ strategy.job-index }}
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
