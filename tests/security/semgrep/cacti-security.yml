# Cacti-aware Semgrep rules.
#
# Off-the-shelf PHP rules do not know Cacti's own primitives, so they miss the
# request-variable -> SQL / shell / RRDtool flows that have produced real CVEs
# and flag htmle()-escaped output as false positives. These rules model:
#   sources     - grv(), gnrv(), get_request_var(), get_nfilter_request_var()
#                 (raw request input)
#                 stored text: db_fetch_cell*(), text columns of fetched rows,
#                 SNMP responses, plugin hook returns, tail_file() log lines
#   sanitizers  - db_qstr[_rlike](), sanitize_sql_column(), (int) cast,
#                 gfrv()/get_filter_request_var(), cacti_escapeshellarg(),
#                 html_escape()/htmle()/__esc*()
#   sinks       - non-prepared db_fetch_*/db_execute, the get_allowed_* WHERE
#                 builders, shell_exec/exec/popen/proc_open/rrdtool_execute,
#                 print/echo, and the contents of form_selectable_cell(), which
#                 writes its first argument verbatim (form_selectable_ecell()
#                 is the escaping variant).
#
# Run:   semgrep --config tests/security/semgrep/cacti-security.yml .
# Test:  semgrep --test    tests/security/semgrep/

rules:
  - id: cacti-request-var-in-sql
    mode: taint
    languages: [php]
    severity: ERROR
    message: >
      A raw request variable flows into a SQL string without parameterization
      or identifier confinement. Use a *_prepared() helper with bound '?'
      parameters, db_qstr()/db_qstr_rlike() for values, or
      sanitize_sql_column() for identifiers. Ref: GHSA-4899 (host_id),
      GHSA-wfcf (group).
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          - pattern: grv(...)
          - pattern: gnrv(...)
          - pattern: get_nfilter_request_var(...)
          - pattern: get_request_var(...)
    pattern-sanitizers:
      - pattern: db_qstr(...)
      - pattern: db_qstr_rlike(...)
      - pattern: sanitize_sql_column(...)
      # array_to_sql_or() quotes each value with db_qstr(), but does not
      # sanitize its column argument. Only a literal identifier is safe.
      - patterns:
          - pattern: array_to_sql_or($VALUES, $COLUMN)
          - metavariable-regex:
              metavariable: $COLUMN
              regex: ^['"][A-Za-z0-9_.]+['"]$
      # gfrv()/get_filter_request_var() are only SQL-safe here when they enforce numeric types
      - pattern: gfrv($NAME)
      - pattern: gfrv($NAME, FILTER_VALIDATE_INT, ...)
      - pattern: gfrv($NAME, FILTER_VALIDATE_FLOAT, ...)
      - pattern: gfrv($NAME, FILTER_VALIDATE_IS_NUMERIC_LIST, ...)
      - pattern: gfrv($NAME, FILTER_VALIDATE_IS_NUMERIC_ARRAY, ...)
      - pattern: get_filter_request_var($NAME)
      - pattern: get_filter_request_var($NAME, FILTER_VALIDATE_INT, ...)
      - pattern: get_filter_request_var($NAME, FILTER_VALIDATE_FLOAT, ...)
      - pattern: get_filter_request_var($NAME, FILTER_VALIDATE_IS_NUMERIC_LIST, ...)
      - pattern: get_filter_request_var($NAME, FILTER_VALIDATE_IS_NUMERIC_ARRAY, ...)
      - pattern: intval(...)
      - pattern: (int) $X
      - pattern: (float) $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: db_fetch_cell($SQL, ...)
              - pattern: db_fetch_assoc($SQL, ...)
              - pattern: db_fetch_row($SQL, ...)
              - pattern: db_fetch_cell($SQL)
              - pattern: db_fetch_assoc($SQL)
              - pattern: db_fetch_row($SQL)
              - pattern: db_execute($SQL)
              - pattern: db_execute($SQL, ...)
              - pattern: get_allowed_graphs($SQL, ...)
              - pattern: get_allowed_graph_templates($SQL, ...)
              - pattern: get_allowed_graph_templates_normalized($SQL, ...)
              - pattern: get_allowed_devices($SQL, ...)
              - pattern: get_allowed_trees($SQL, ...)
          # the *_prepared variants bind values and are safe
          - pattern-not: db_fetch_cell_prepared(...)
          - pattern-not: db_fetch_assoc_prepared(...)
          - pattern-not: db_fetch_row_prepared(...)
          - pattern-not: db_execute_prepared(...)

  - id: cacti-request-var-in-shell-or-rrdtool
    mode: taint
    languages: [php]
    severity: ERROR
    message: >
      A raw request or stored value reaches a shell / RRDtool command without
      cacti_escapeshellarg(). RRDtool batch mode also treats a newline as a
      command separator, so strip CR/LF too. Ref: GHSA-hcj6 / CVE-2026-39949.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          - pattern: grv(...)
          - pattern: gnrv(...)
          - pattern: get_nfilter_request_var(...)
          - pattern: get_request_var(...)
    pattern-sanitizers:
      - pattern: cacti_escapeshellarg(...)
      - pattern: cacti_escapeshellcmd(...)
      - pattern: escapeshellarg(...)
      - pattern: intval(...)
      - pattern: (int) $X
    pattern-sinks:
      - pattern-either:
          - pattern: shell_exec($CMD)
          - pattern: exec($CMD, ...)
          - pattern: exec($CMD)
          - pattern: popen($CMD, ...)
          - pattern: proc_open($CMD, ...)
          - pattern: system($CMD, ...)
          - pattern: passthru($CMD, ...)
          - pattern: rrdtool_execute($CMD, ...)

  - id: cacti-request-var-echoed-unescaped
    mode: taint
    languages: [php]
    severity: WARNING
    message: >
      A raw request variable is written to the response without html_escape()
      /htmle(). In an HTML or a single-quoted JS-string context this is XSS.
      Ref: GHSA-c3wx (device location value attribute).
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      category: security
      confidence: LOW
    pattern-sources:
      - pattern-either:
          - pattern: grv(...)
          - pattern: gnrv(...)
          - pattern: get_nfilter_request_var(...)
          - pattern: get_request_var(...)
    pattern-sanitizers:
      - pattern: html_escape(...)
      - pattern: htmle(...)
      - pattern: htmlspecialchars(...)
      - pattern: json_encode(...)
      # filter_value() escapes values, link targets, and titles before adding
      # optional highlighting markup.
      - pattern: filter_value(...)
      # These helpers return context-escaped markup and have dedicated unit tests.
      - pattern: html_hidden_input(...)
      - pattern: html_nav_bar(...)
      # clean_up_name() confines values to ASCII letters, digits, and underscores.
      - pattern: clean_up_name(...)
      - pattern: intval(...)
      - pattern: (int) $X
    pattern-sinks:
      - pattern-either:
          - pattern: print $X;
          - pattern: echo $X;

  - id: cacti-stored-value-echoed-unescaped
    mode: taint
    options:
      # $labels[$row['status']] is a lookup in a static table, not stored text.
      taint_assume_safe_indexes: true
    paths:
      # CLI tools and data-input scripts write plain text, not HTML.
      exclude:
        - cli/
        - scripts/
    languages: [php]
    severity: WARNING
    message: >
      A stored value (database text column, SNMP response, plugin hook return,
      or log line) is written to the response without html_escape()/htmle().
      Device descriptions, graph titles, notes and sysDescr strings are set by
      lower-privileged users or by the monitored device, so this is stored XSS
      against whoever views the page.
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      category: security
      confidence: LOW
    pattern-sources:
      - pattern-either:
          - pattern: db_fetch_cell(...)
          - pattern: db_fetch_cell_prepared(...)
          # Rows are matched by column name rather than by db_fetch_*() call so
          # that numeric columns (id, host_id, status) do not drown the signal.
          - patterns:
              - pattern: $ROW[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^['"](description|hostname|name|name_cache|title|title_cache|notes|message|location|external_id|snmp_sys(Descr|Name|Location|Contact|ObjectID)|snmp_community|username|full_name|email_address|status_last_error|data_source_name|field_value|value)['"]$
          - pattern: cacti_snmp_get(...)
          - pattern: cacti_snmp_get_raw(...)
          - pattern: cacti_snmp_getnext(...)
          - pattern: cacti_snmp_walk(...)
          - pattern: cacti_snmp_get_multi(...)
          - pattern: cacti_snmp_session_get(...)
          - pattern: cacti_snmp_session_getnext(...)
          - pattern: cacti_snmp_session_walk(...)
          - pattern: api_plugin_hook_function(...)
          - pattern: tail_file(...)
    pattern-sanitizers:
      - pattern: html_escape(...)
      - pattern: htmle(...)
      - pattern: htmlspecialchars(...)
      - pattern: __esc(...)
      - pattern: __esc_n(...)
      - pattern: __esc_x(...)
      - pattern: json_encode(...)
      - pattern: filter_value(...)
      - pattern: html_hidden_input(...)
      - pattern: clean_up_name(...)
      - pattern: number_format_i18n(...)
      - pattern: html_nav_bar(...)
      - pattern: round(...)
      - pattern: floatval(...)
      - pattern: cacti_sizeof(...)
      # Whole rows are not sources; their text columns are matched by name
      # above. Without this, a request variable in the WHERE clause taints
      # every column, numeric ones included.
      - pattern: db_fetch_assoc(...)
      - pattern: db_fetch_assoc_prepared(...)
      - pattern: db_fetch_row(...)
      - pattern: db_fetch_row_prepared(...)
      - pattern: intval(...)
      - pattern: (int) $X
      - pattern: (float) $X
    pattern-sinks:
      - pattern-either:
          - pattern: print $X;
          - pattern: echo $X;

  - id: cacti-unescaped-form-selectable-cell
    mode: taint
    options:
      # $labels[$row['status']] is a lookup in a static table, not stored text.
      taint_assume_safe_indexes: true
    paths:
      # CLI tools and data-input scripts write plain text, not HTML.
      exclude:
        - cli/
        - scripts/
    languages: [php]
    severity: WARNING
    message: >
      form_selectable_cell() writes its first argument into the table cell
      without escaping. Pass request or stored text through
      form_selectable_ecell(), or html_escape() it before adding markup.
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern-either:
          - pattern: grv(...)
          - pattern: gnrv(...)
          - pattern: get_request_var(...)
          - pattern: get_nfilter_request_var(...)
          - pattern: db_fetch_cell(...)
          - pattern: db_fetch_cell_prepared(...)
          - patterns:
              - pattern: $ROW[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^['"](description|hostname|name|name_cache|title|title_cache|notes|message|location|external_id|snmp_sys(Descr|Name|Location|Contact|ObjectID)|snmp_community|username|full_name|email_address|status_last_error|data_source_name|field_value|value)['"]$
          - pattern: cacti_snmp_get(...)
          - pattern: cacti_snmp_getnext(...)
          - pattern: cacti_snmp_walk(...)
          - pattern: cacti_snmp_session_get(...)
          - pattern: cacti_snmp_session_walk(...)
          - pattern: api_plugin_hook_function(...)
    pattern-sanitizers:
      - pattern: html_escape(...)
      - pattern: htmle(...)
      - pattern: htmlspecialchars(...)
      - pattern: __esc(...)
      - pattern: __esc_n(...)
      - pattern: __esc_x(...)
      - pattern: filter_value(...)
      - pattern: clean_up_name(...)
      - pattern: number_format_i18n(...)
      - pattern: html_nav_bar(...)
      - pattern: round(...)
      - pattern: floatval(...)
      - pattern: cacti_sizeof(...)
      # Whole rows are not sources; their text columns are matched by name
      # above. Without this, a request variable in the WHERE clause taints
      # every column, numeric ones included.
      - pattern: db_fetch_assoc(...)
      - pattern: db_fetch_assoc_prepared(...)
      - pattern: db_fetch_row(...)
      - pattern: db_fetch_row_prepared(...)
      - pattern: intval(...)
      - pattern: (int) $X
      - pattern: (float) $X
    pattern-sinks:
      - patterns:
          - pattern: form_selectable_cell($CONTENTS, ...)
          - focus-metavariable: $CONTENTS
