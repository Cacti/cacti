# SonarQube Cloud automatic analysis reads this file from the default branch.
# Analyze tests/ as test code so that fixture-only constructs (temporary
# scripts, loopback HTTP servers, generated table names) are not reported as
# production vulnerabilities, while the application code stays in scope.
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests

# The settings tables and each theme's main.js repeat the same structure by
# design (one array entry per setting, one script copy per theme), so a new
# setting or a change applied to every theme is reported as duplication.
sonar.cpd.exclusions=include/global_settings.php,include/themes/**/main.js
